name: Deploy Usul16

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 91.98.192.21
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: /home/deploy/deploy-usul16.sh
          command_timeout: 20m